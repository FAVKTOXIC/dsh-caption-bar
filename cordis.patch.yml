# dsh-caption-bar bundle patch: inserts the loader row for the web plugin roster.
# The bundle is the official dsh plugin shape — install with
#   dsh plugin --profile <name> add dsh-caption-bar
# and this row lands in the browser roster plus the host Loader automatically
# (reconciled by `dsh plugin` from the package's `dsh.bundle.patch` declaration).
# To uninstall: `dsh plugin --profile <name> remove dsh-caption-bar`.
- insert:
    - id: caption-bar
      name: 'dsh-caption-bar'
